version: 2.1

jobs:
  prepare-ayugram:
    machine:
      image: windows-server-2022-gui:current
    resource_class: windows.medium
    shell: powershell.exe -ExecutionPolicy Bypass

    steps:
      - checkout

      - run:
          name: Install CMake and Ninja
          command: |
            choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
            choco install ninja -y

            $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" +
                        [System.Environment]::GetEnvironmentVariable("Path","User")

            cmake --version
            ninja --version

      - run:
          name: Prepare build directories
          command: |
            New-Item -ItemType Directory -Force `
              C:\TBuild\Libraries, `
              C:\TBuild\ThirdParty | Out-Null

      - run:
          name: Clone AyuGram 7.0.9
          command: |
            git clone `
              --recursive `
              --branch v7.0.9 `
              https://github.com/AyuGram/AyuGramDesktop.git `
              C:\TBuild\tdesktop

      - run:
          name: Verify MSVC and ATL
          command: |
            $vs = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools"

            $vcvars = "$vs\VC\Auxiliary\Build\vcvars64.bat"
            $atl = "$vs\VC\Tools\MSVC\14.44.35207\atlmfc\include\atlbase.h"

            if (!(Test-Path $vcvars)) {
              throw "vcvars64.bat not found"
            }

            if (!(Test-Path $atl)) {
              throw "ATL 14.44 not found"
            }

            Write-Host "MSVC/ATL OK"
            Write-Host $atl

      - run:
          name: Disk before prepare
          command: |
            $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"
            Write-Host "Free GB: $([math]::Round($disk.FreeSpace / 1GB, 2))"

      - run:
          name: Install Python 3.10
          command: |
            choco install python --version=3.10.11 -y --allow-downgrade

            $python310 = "C:\Python310"

            if (!(Test-Path "$python310\python.exe")) {
              throw "Python 3.10 was not installed"
            }

            $env:Path = "$python310;$python310\Scripts;$env:Path"

            Write-Host "Python used for prepare:"
            python --version
            where.exe python

      - run:
          name: Prepare AyuGram libraries
          command: |
            @"
            set "PATH=C:\Python310;C:\Python310\Scripts;%PATH%"
            set "CMAKE_BUILD_PARALLEL_LEVEL=2"

            call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44

            cd /d C:\TBuild

            python --version
            where python

            call tdesktop\Telegram\build\prepare\win.bat
            "@ | Out-File -Encoding ASCII C:\TBuild\prepare.cmd

            cmd.exe /c C:\TBuild\prepare.cmd
            
      - run:
          name: Disk after prepare
          command: |
            $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"

            Write-Host "Disk total GB:"
            Write-Host ([math]::Round($disk.Size / 1GB, 2))

            Write-Host "Disk free GB:"
            Write-Host ([math]::Round($disk.FreeSpace / 1GB, 2))

            Write-Host ""
            Write-Host "TBuild size:"

            $bytes = (
              Get-ChildItem C:\TBuild `
                -File `
                -Recurse `
                -ErrorAction SilentlyContinue |
              Measure-Object Length -Sum
            ).Sum

            Write-Host "$([math]::Round($bytes / 1GB, 2)) GB"

workflows:
  prepare-test:
    jobs:
      - prepare-ayugram
